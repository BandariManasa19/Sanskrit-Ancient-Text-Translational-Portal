name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd AI-Powered-Sanskrit-Story-Visual-Translator-main/frontend
          npm install

      - name: Build frontend
        run: |
          cd AI-Powered-Sanskrit-Story-Visual-Translator-main/frontend
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./AI-Powered-Sanskrit-Story-Visual-Translator-main/frontend/build
          destination_dir: /
